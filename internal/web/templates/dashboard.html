{{define "content"}}
<section class="panel">
  <h1>Dashboard</h1>
  <div class="stats" id="stats">
    <div class="stat"><span class="stat-num">-</span><span class="stat-label">total</span></div>
    <div class="stat"><span class="stat-num">-</span><span class="stat-label">saved</span></div>
    <div class="stat"><span class="stat-num">-</span><span class="stat-label">today</span></div>
    <div class="stat"><span class="stat-num">-</span><span class="stat-label">scopes</span></div>
    <div class="stat"><span class="stat-num">-</span><span class="stat-label">rules</span></div>
  </div>
  <p class="muted" id="flush-info"></p>
  <div class="row">
    <a class="btn" href="/admin/requests">View requests</a>
    <a class="btn" href="/admin/scopes">Manage scopes</a>
    <a class="btn" href="/admin/notifications">Manage alerts</a>
    <button class="btn btn-ghost" id="flush-now">Flush now</button>
  </div>
</section>
<script>
document.addEventListener("DOMContentLoaded", () => {
  api("/admin/api/stats")
    .then((s) => {
      const nums = document.querySelectorAll("#stats .stat-num");
      nums[0].textContent = s.total;
      nums[1].textContent = s.saved;
      nums[2].textContent = s.today;
      nums[3].textContent = s.scope_count;
      nums[4].textContent = s.rule_count;
      document.getElementById("flush-info").textContent =
        "last flush: " + (s.last_flush_at ? formatISOLocal(s.last_flush_at) : "never");
    })
    .catch((e) => toast(e.message));
  document.getElementById("flush-now").addEventListener("click", async () => {
    const data = await api("/admin/api/flush", { method: "POST" });
    toast("flushed " + data.deleted + " requests");
    location.reload();
  });
});
</script>
{{end}}
