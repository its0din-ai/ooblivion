{{define "content"}}
<section class="panel">
  <div class="stats" id="stats">
    <div class="stat"><span class="stat-num">-</span><span class="stat-label">total</span></div>
    <div class="stat"><span class="stat-num">-</span><span class="stat-label">saved</span></div>
    <div class="stat"><span class="stat-num">-</span><span class="stat-label">today</span></div>
    <div class="stat"><span class="stat-num">-</span><span class="stat-label">scopes</span></div>
    <div class="stat"><span class="stat-num">-</span><span class="stat-label">rules</span></div>
  </div>
  <p class="muted" id="flush-info"></p>
  <div class="row">
    <a class="btn btn-primary" href="/admin/requests">View requests</a>
    <a class="btn" href="/admin/scopes">Manage scopes</a>
    <a class="btn" href="/admin/notifications">Manage alerts</a>
    <a class="btn" href="/admin/settings">Settings</a>
  </div>
</section>
<script>
document.addEventListener("DOMContentLoaded", () => {
  api("/admin/api/stats")
    .then((s) => {
      const nums = document.querySelectorAll("#stats .stat-num");
      const values = [s.total, s.saved, s.today, s.scope_count, s.rule_count];
      nums.forEach((el, i) => {
        if (window.countUp) {
          countUp(el, values[i]);
        } else {
          el.textContent = values[i];
        }
      });
      document.getElementById("flush-info").textContent =
        "last flush: " + (s.last_flush_at ? formatHumanTime(s.last_flush_at) : "never");
    })
    .catch((e) => toast(e.message));
});
</script>
{{end}}
