{{define "content"}}
<div class="auth-backdrop" aria-hidden="true">
  <span class="auth-orb auth-orb-top"></span>
  <span class="auth-orb auth-orb-bottom"></span>
</div>
<section class="auth-card">
  <div class="auth-brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"></circle>
      <circle cx="12" cy="12" r="9" stroke-dasharray="2 3"></circle>
      <path d="M12 3v4M12 17v4M3 12h4M17 12h4"></path>
    </svg>
    <h1>[oob]livion</h1>
    <p class="muted">out-of-band capture console</p>
  </div>
  <form id="login-form" class="stack">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" minlength="16" required autofocus>
    <button type="submit" class="btn btn-primary btn-block" id="login-submit">Sign in</button>
    <p id="login-error" class="error" hidden></p>
  </form>
  <div class="auth-meta">
    <span class="auth-version">deployed {{.Version}}</span>
    <p class="auth-lost">Lost? go back to <a href="https://www.encrypt0r.net/" target="_blank" rel="noopener noreferrer">https://www.encrypt0r.net/</a></p>
  </div>
</section>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("login-form");
  const err = document.getElementById("login-error");
  const submit = document.getElementById("login-submit");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.hidden = true;
    submit.disabled = true;
    submit.textContent = "Signing in…";
    try {
      const res = await fetch("/admin/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("password").value }),
      });
      const data = await res.json();
      if (!res.ok) {
        err.textContent = data.error || "you shall not pass!";
        err.hidden = false;
        if (window.reveal) reveal(err);
        if (window.pop) pop(form);
        submit.disabled = false;
        submit.textContent = "Sign in";
        return;
      }
      location.href = "/admin";
    } catch (e) {
      err.textContent = "connection failed";
      err.hidden = false;
      if (window.reveal) reveal(err);
      submit.disabled = false;
      submit.textContent = "Sign in";
    }
  });
});
</script>
{{end}}
