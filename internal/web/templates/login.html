{{define "content"}}
<section class="panel login-card">
  <h1>[oob]livion</h1>
  <p class="muted">out-of-band capture console</p>
  <form id="login-form" class="stack">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" minlength="16" required autofocus>
    <button type="submit" class="btn btn-primary">Login</button>
    <p id="login-error" class="error" hidden></p>
  </form>
</section>
<div class="login-theme">
  <button class="theme-toggle" data-theme-toggle type="button" aria-label="Toggle theme">
    <svg class="icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
    </svg>
    <svg class="icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
    </svg>
  </button>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("login-form");
  const err = document.getElementById("login-error");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.hidden = true;
    const res = await fetch("/admin/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password").value }),
    });
    const data = await res.json();
    if (!res.ok) {
      err.textContent = data.error || "you shall not pass!";
      err.hidden = false;
      return;
    }
    location.href = "/admin";
  });
});
</script>
{{end}}
