# ooblivion deployment (Caddy runs on the host, NOT in Docker)
#
# Before first run:
#   1. cp .env.example .env  and fill JWT_SECRET (>=64 bytes), ADMIN_PASSWORD (>=16 chars)
#   2. Set ADMIN_HOST to your PUBLIC admin domain, e.g. ADMIN_HOST=ooblivion.acme.corp
#      (the Host header seen by the app is the proxy hostname, not 127.0.0.1)
#   3. Optionally set TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
#   4. On the host: use Caddyfile.example and point it at 127.0.0.1:8080
#   5. docker compose pull && docker compose up -d      (prebuilt GHCR image)
#      or: docker compose up -d --build                 (build locally)
#
# The default image is the published GHCR build. Pin a release with
# OOB_IMAGE=ghcr.io/its0din-ai/ooblivion:v1.6 in .env; the version shown in the
# UI is baked into the image at build time, so image tag == displayed version.
#
# The ooblivion port is exposed to the host so the host Caddy can reach it.
# Data (SQLite) is persisted in the ooblivion_data volume. It survives rebuilds and restarts.

services:
  ooblivion:
    image: ${OOB_IMAGE:-ghcr.io/its0din-ai/ooblivion:latest}
    build:
      context: .
      args:
        VERSION: ${OOB_VERSION:-dev}
        COMMIT: ${OOB_COMMIT:-dev}
        BUILDDATE: ${OOB_BUILDDATE:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # container-correct overrides; everything else (JWT_SECRET, ADMIN_PASSWORD,
      # ADMIN_HOST, telegram, ...) comes from .env
      OOB_LISTEN_ADDR: ":8080"
      DATABASE_PATH: /app/data/ooblivion.db
    ports:
      # exposed to the host for Caddy (host Caddy reverse_proxy 127.0.0.1:8080)
      - "8080:8080"
    volumes:
      - ooblivion_data:/app/data
    healthcheck:
      # The probe sends HEALTH_CHECK_SECRET from .env as X-Health-Check, so its
      # /healthz hits are answered 200 and never stored. Without the secret every
      # /healthz request is captured like any other path. The port comes from
      # OOB_LISTEN_ADDR so overrides stay in sync.
      test: ["CMD-SHELL", "wget -q -O /dev/null --header=\"X-Health-Check: $${HEALTH_CHECK_SECRET}\" http://127.0.0.1:$${OOB_LISTEN_ADDR##*:}/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  ooblivion_data:
